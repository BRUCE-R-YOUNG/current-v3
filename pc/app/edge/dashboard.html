<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sustainable Vision Learning 3</title>
<style>
:root{--ink:#182223;--muted:#617073;--line:#d8e0df;--green:#076f61;--bg:#f4f7f6}*{box-sizing:border-box}body{margin:0;font:14px/1.55 system-ui,sans-serif;color:var(--ink);background:var(--bg);letter-spacing:0}button,input,select,textarea{font:inherit}button{cursor:pointer;background:var(--green);color:white;border:1px solid var(--green);padding:8px 14px;border-radius:6px}button.secondary{background:white;color:var(--ink);border-color:var(--line)}button:disabled{opacity:.45;cursor:not-allowed}input,select,textarea{width:100%;min-width:0;border:1px solid #bfcac8;border-radius:5px;padding:8px;background:white;color:var(--ink)}input[type=checkbox]{width:20px;height:20px}label{display:grid;gap:5px;color:var(--muted)}header{background:white;border-bottom:1px solid var(--line);padding:16px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}header strong{font-size:20px}small{color:var(--muted)}nav{display:flex;gap:24px;padding:0 24px;background:white;border-bottom:1px solid var(--line);overflow-x:auto}nav a{padding:13px 0;white-space:nowrap;text-decoration:none;color:var(--muted);border-bottom:3px solid transparent}nav a.active{color:var(--green);border-color:var(--green)}main{max-width:1440px;margin:auto;padding:24px}h1{font-size:25px;margin:0 0 6px}h2{font-size:17px;margin:0 0 14px}.heading,.actions{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.actions{justify-content:flex-start}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin:24px 0}.stat{border-top:3px solid var(--green);padding:16px;background:white;border-radius:4px}.stat:nth-child(2){border-color:#467dc3}.stat:nth-child(3){border-color:#ae6d25}.stat:nth-child(4){border-color:#a34b68}.stat strong{display:block;font-size:30px}.columns{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:24px}.band{padding:20px 0;border-top:1px solid var(--line);min-width:0}#preview{width:100%;aspect-ratio:16/9;object-fit:contain;background:#e7eeeb;display:block}canvas{display:block;width:100%;height:170px;background:white}.form{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.wide{grid-column:1/-1}.table-scroll{overflow:auto;max-height:380px}table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}th{position:sticky;top:0;background:var(--bg)}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px;max-height:240px;overflow:auto}#notice{color:#a13439;min-height:24px;overflow-wrap:anywhere}#login{max-width:440px;margin:12vh auto;padding:28px;background:white;border:1px solid var(--line);border-radius:8px}#login button{margin-top:16px}dialog{width:min(720px,95vw);max-height:85vh;border:1px solid var(--line);border-radius:8px}#fileList{display:grid;gap:6px;max-height:55vh;overflow:auto}#fileList button{text-align:left;overflow-wrap:anywhere}body [hidden]{display:none!important}@media(max-width:760px){main{padding:16px}header{padding:12px 16px}nav{padding:0 16px;gap:18px}.stats{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.stat{padding:12px}.stat strong{font-size:24px}.columns,.form{grid-template-columns:1fr}h1{font-size:22px}}
</style></head><body>
<section id="login"><h1>Sustainable Vision Learning</h1><p>Version 3 · Edge &amp; Learning</p><label>アクセストークン<input id="token" type="password" autocomplete="off"></label><button id="connect">接続</button><p id="loginError"></p></section>
<div id="shell" hidden><header><div><strong>Sustainable Vision Learning</strong><br><small id="identity"></small></div><div class="actions"><span id="connection">接続中</span><button class="secondary" id="logout">切断</button></div></header><nav id="nav"></nav><main>
<div class="heading"><div><h1 id="title"></h1><small id="subtitle"></small></div><div class="actions" id="commands"></div></div><p id="notice" role="status"></p>
<section id="overview"><div class="stats"><div class="stat">平均人数<strong id="people">—</strong><small>画面内の検出人数</small></div><div class="stat">階数<strong id="floor">—</strong><small id="floorMean"></small></div><div class="stat">方向<strong id="direction">—</strong><small id="directionRatio"></small></div><div class="stat">1階への予測時間<strong id="eta">—</strong><small>設定した経路・停止時間による予測</small></div></div>
<div class="columns"><section class="band"><h2>キャプチャー画像</h2><img id="preview" alt="最新のキャプチャー" hidden><p id="noPreview">画像はまだありません</p><small id="previewNote"></small></section><section class="band"><h2>人数の推移</h2><canvas id="chart" width="900" height="220"></canvas><p id="windowInfo"></p><h2>サービス</h2><div id="services"></div></section></div>
<section class="band"><h2>通信・蓄積状況</h2><div id="queue"></div><pre id="errors"></pre></section><section class="band"><h2>受信・集計履歴</h2><div class="table-scroll"><table><thead><tr><th>時刻</th><th>デバイス</th><th>フレーム</th><th>平均人数</th><th>階数 / 平均</th><th>方向</th><th>1階まで</th></tr></thead><tbody id="history"></tbody></table></div></section></section>
<section id="settings" hidden><div class="band"><div class="form" id="fields"></div></div><button id="save">設定を保存</button><section id="projectForm" class="band" hidden><h2>PCの学習プロジェクト</h2><div class="form"><label>プロジェクトID<input id="projectId"></label><label>名前<input id="projectName"></label><label>クラス名（カンマ区切り）<input id="projectClasses" placeholder="1,2,3,UP,DOWN"></label></div><p><button class="secondary" id="createProject">プロジェクト作成</button></p><div id="projectList"></div></section></section>
</main></div><dialog id="picker"><div class="heading"><h2>パスを選択</h2><button class="secondary" id="closePicker">閉じる</button></div><p id="pickerHost"></p><div class="actions"><input id="browsePath"><button class="secondary" id="browse">移動</button><button class="secondary" id="parent">親フォルダー</button></div><p id="pickerError"></p><div id="fileList"></div></dialog>
<script>
const $=id=>document.getElementById(id);let cfg,token=sessionStorage.getItem('svl_v3_token')||'',timer,objectUrl,fieldTarget,parentPath;
const page=new URLSearchParams(location.search).get('page')||'overview';
const titles={overview:'ダッシュボード',production:'本番推論',capture:'画像キャプチャー',transfer:'HTTP転送',train:'学習',receiver:'受信設定'};
const groups={production:['camera','people_model','elevator_model','device','imgsz','confidence','roi','window_seconds','frames_per_window','highest_floor','seconds_per_floor','stop_seconds','turnaround_seconds','floor_stop_seconds','floor_map','people_classes','up_classes','down_classes','capture_seconds','difficult_only','difficult_confidence','duplicate_threshold'],capture:['camera','roi','capture_seconds','duplicate_threshold','jpeg_long_edge','jpeg_quality'],transfer:['server_url','project_id','device_id','token_env','transfer_seconds','telemetry_seconds','timeout_seconds','daily_image_bytes','daily_transfer_bytes','monthly_transfer_bytes','spool_limit_bytes'],train:['project_id','dataset_yaml','device','epochs','batch','workers','imgsz','promote_if_passed','export_onnx'],receiver:['project_id','token_env','spool_limit_bytes']};
const labels={camera:'カメラ番号・動画パス・RTSP URL',people_model:'人物モデル',elevator_model:'階数・方向モデル',device:'CPU / GPU番号',imgsz:'推論・学習画像サイズ',confidence:'検出confidence',roi:'表示パネルROI [x1,y1,x2,y2]（0〜1）',window_seconds:'集計窓（秒）',frames_per_window:'1窓あたりの推論フレーム数',highest_floor:'最高階',seconds_per_floor:'1階分の移動秒数',stop_seconds:'各階の停止秒数',turnaround_seconds:'最高階での折り返し秒数',floor_stop_seconds:'階ごとの停止秒数（JSON）',floor_map:'モデルのクラス名 → 階数（JSON）',people_classes:'人物クラス名（JSON配列）',up_classes:'UPクラス名（JSON配列）',down_classes:'DOWNクラス名（JSON配列）',capture_seconds:'画像保存の最小間隔（秒）',difficult_only:'低信頼・見逃し画像のみ保存',difficult_confidence:'難例confidence上限',duplicate_threshold:'重複除外しきい値',jpeg_long_edge:'転送JPEG長辺',jpeg_quality:'JPEG品質',server_url:'PC側のHTTPS URL',project_id:'PCと共通のプロジェクトID',device_id:'Raspberry PiのID',token_env:'認証トークンの環境変数名',transfer_seconds:'画像転送間隔（秒）',telemetry_seconds:'集計値転送間隔（秒）',timeout_seconds:'HTTPタイムアウト（秒）',daily_image_bytes:'画像の日次上限（bytes）',daily_transfer_bytes:'転送全体の日次上限（bytes）',monthly_transfer_bytes:'転送全体の月次上限（bytes）',spool_limit_bytes:'ローカル蓄積上限（bytes）',dataset_yaml:'ラベル付きdataset.yaml',epochs:'Epochs',batch:'Batch',workers:'Workers',promote_if_passed:'評価合格時のみ自動昇格',export_onnx:'評価合格時にONNXを書き出す'};
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const number=v=>v==null?'—':Number(v).toFixed(1);
async function api(path,options={}){const r=await fetch('/v3'+path,{...options,headers:{Authorization:'Bearer '+token,'Content-Type':'application/json',...options.headers}});if(!r.ok){let d=await r.json();throw Error(typeof d.detail==='string'?d.detail:JSON.stringify(d.detail));}return r.json();}
function error(e){$('notice').textContent=e.message;}
async function connect(){try{token=$('token').value||token;cfg=await api('/config');sessionStorage.setItem('svl_v3_token',token);$('login').hidden=true;$('shell').hidden=false;render();await refresh();}catch(e){$('loginError').textContent=e.message;}}
function render(){const pages=cfg.role==='edge'?['overview','production','capture','transfer']:['overview','receiver','train'];$('nav').innerHTML=pages.map(k=>`<a class="${k===page?'active':''}" href="/v3?page=${k}">${titles[k]}</a>`).join('');$('identity').textContent=`Version 3 · ${cfg.role==='edge'?'Raspberry Pi / Edge':'PC / Server'} · ${cfg.project_id}`;$('title').textContent=titles[page]||titles.overview;$('subtitle').textContent=cfg.role==='edge'?'推論・画像蓄積はこの端末で実行':'別ネットワークのPiからHTTPSで受信';$('overview').hidden=page!=='overview';$('settings').hidden=page==='overview';$('commands').replaceChildren();if(['production','capture','transfer','train'].includes(page)&&pages.includes(page)){for(const [action,label] of [['start','開始'],['stop','停止']]){const b=document.createElement('button');b.textContent=label;b.className=action==='stop'?'secondary':'';b.onclick=()=>service(page,action);$('commands').append(b);}}if(cfg.role==='server'&&page==='receiver'){const b=document.createElement('button');b.textContent='受信画像の疑似ラベルを生成';b.onclick=()=>service('label','start');$('commands').append(b);}$('fields').replaceChildren();for(const key of groups[page]||[]){const label=document.createElement('label');label.textContent=labels[key];const complex=typeof cfg[key]==='object';const input=document.createElement(complex?'textarea':'input');input.id='field-'+key;input.dataset.key=key;if(complex){input.value=JSON.stringify(cfg[key]);label.className='wide';}else if(typeof cfg[key]==='boolean'){input.type='checkbox';input.checked=cfg[key];}else{input.type=typeof cfg[key]==='number'?'number':'text';input.step='any';input.value=cfg[key];}label.append(input);if(['people_model','elevator_model','dataset_yaml','camera'].includes(key)){const b=document.createElement('button');b.type='button';b.className='secondary';b.textContent='パスを選択';b.onclick=()=>{fieldTarget=input;$('pickerHost').textContent=cfg.role==='edge'?'Raspberry Pi側のファイル':'PC側のファイル';$('picker').showModal();browse(input.value).catch(e=>$('pickerError').textContent=e.message);};label.append(b);}$('fields').append(label);}$('projectForm').hidden=page!=='receiver';if(page==='receiver')loadProjects().catch(error);}
async function service(name,action){try{await api(`/services/${name}/${action}`,{method:'POST'});$('notice').textContent=action==='stop'?'停止を要求しました。学習は次の進捗更新で停止します。':'起動を要求しました';await refresh();}catch(e){error(e);}}
async function refresh(){clearTimeout(timer);try{const d=await api('/status');$('connection').textContent='接続済み';const last=d.recent[0]||{};$('people').textContent=number(last.people_mean);$('floor').textContent=last.floor??'不明';$('floorMean').textContent='平均 '+number(last.floor_mean);$('direction').textContent=last.direction||'不明';$('directionRatio').textContent=`UP ${number(last.up_ratio)} / DOWN ${number(last.down_ratio)}`;$('eta').textContent=last.return_seconds_mean==null?'推定不可':number(last.return_seconds_mean)+' 秒';$('windowInfo').textContent=last.actual_frames==null?'集計データはまだありません':`${last.device_id} · ${last.actual_frames}/${last.expected_frames} フレーム · ${new Date(last.window_end*1000).toLocaleString()}`;$('history').innerHTML=d.recent.map(r=>`<tr><td>${esc(new Date(r.window_end*1000).toLocaleString())}</td><td>${esc(r.device_id)}</td><td>${esc(r.actual_frames)} / ${esc(r.expected_frames)}</td><td>${number(r.people_mean)}</td><td>${esc(r.floor??'不明')} / ${number(r.floor_mean)}</td><td>${esc(r.direction??'不明')}</td><td>${number(r.return_seconds_mean)}</td></tr>`).join('');$('services').innerHTML=Object.entries(d.states).map(([k,v])=>`<p><strong>${esc(k)}</strong> · ${esc(v.status)} ${v.progress!=null?number(v.progress)+'%':''}<br><small>${esc(v.message||v.error||v.reason||'')} · ${new Date(v.updated*1000).toLocaleTimeString()}</small></p>`).join('')||'未起動';$('queue').textContent=d.counts.map(r=>`${r.kind}: ${r.count}件（${cfg.role==='server'?'受信済み':r.sent?'送信済み':'未送信'}）`).join(' / ')||'蓄積データなし';$('errors').textContent=JSON.stringify({transfer_errors:d.errors,estimated_usage:d.usage},null,2);draw(d.recent.filter(r=>r.device_id===last.device_id));if(page==='overview')await preview();}catch(e){$('connection').textContent='接続エラー';error(e);}timer=setTimeout(refresh,3000);}
function draw(rows){const c=$('chart'),ctx=c.getContext('2d');ctx.clearRect(0,0,c.width,c.height);const values=rows.slice().reverse().map(r=>r.people_mean);const max=Math.max(1,...values.filter(v=>v!=null));ctx.strokeStyle='#d8e0df';ctx.beginPath();ctx.moveTo(30,10);ctx.lineTo(30,195);ctx.lineTo(880,195);ctx.stroke();ctx.fillStyle='#617073';ctx.font='16px sans-serif';ctx.fillText(String(Math.ceil(max)),4,25);ctx.fillText('0',10,195);ctx.strokeStyle='#076f61';ctx.lineWidth=3;ctx.beginPath();let gap=true;values.forEach((v,i)=>{if(v==null){gap=true;return;}const x=35+i*840/Math.max(1,values.length-1),y=190-v/max*170;if(gap)ctx.moveTo(x,y);else ctx.lineTo(x,y);gap=false;});ctx.stroke();}
async function preview(){const r=await fetch('/v3/preview',{headers:{Authorization:'Bearer '+token}});if(!r.ok){$('preview').hidden=true;$('noPreview').hidden=false;return;}if(objectUrl)URL.revokeObjectURL(objectUrl);objectUrl=URL.createObjectURL(await r.blob());$('preview').src=objectUrl;$('preview').hidden=false;$('noPreview').hidden=true;$('previewNote').textContent=cfg.role==='edge'?'直近の取得フレーム（ライブ動画ではありません）':'直近の受信画像（Piから転送されたROI）';}
async function browse(path=''){const d=await api('/files?path='+encodeURIComponent(path));parentPath=d.parent;$('browsePath').value=d.path;$('pickerError').textContent='';$('fileList').replaceChildren();for(const item of d.entries){const b=document.createElement('button');b.className='secondary';b.textContent=(item.directory?'[Folder] ':'')+item.name;b.onclick=()=>item.directory?browse(item.path).catch(e=>$('pickerError').textContent=e.message):(fieldTarget.value=item.path,$('picker').close());$('fileList').append(b);}}
async function loadProjects(){const ps=await api('/projects');$('projectList').textContent=ps.map(p=>p.project_id+' · '+p.project_name).join(' / ');}
$('save').onclick=async()=>{try{const data=structuredClone(cfg);for(const input of document.querySelectorAll('[data-key]')){const k=input.dataset.key;data[k]=typeof cfg[k]==='object'?JSON.parse(input.value):typeof cfg[k]==='boolean'?input.checked:typeof cfg[k]==='number'?Number(input.value):input.value;}cfg=await api('/config',{method:'PUT',body:JSON.stringify(data)});$('notice').textContent='設定を保存しました';}catch(e){error(e);}};
$('createProject').onclick=async()=>{try{await api('/projects',{method:'POST',body:JSON.stringify({project_id:$('projectId').value,project_name:$('projectName').value,class_names:$('projectClasses').value.split(',').map(s=>s.trim()).filter(Boolean)})});await loadProjects();}catch(e){error(e);}};
$('connect').onclick=connect;$('logout').onclick=()=>{sessionStorage.removeItem('svl_v3_token');location.reload();};$('closePicker').onclick=()=>$('picker').close();$('browse').onclick=()=>browse($('browsePath').value).catch(e=>$('pickerError').textContent=e.message);$('parent').onclick=()=>browse(parentPath).catch(e=>$('pickerError').textContent=e.message);if(token)connect();
</script></body></html>
